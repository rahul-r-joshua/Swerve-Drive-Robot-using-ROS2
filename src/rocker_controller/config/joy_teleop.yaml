joy_teleop:
  ros__parameters:
    move:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      topic_name: input_joy/cmd_vel_stamped
      deadman_buttons: [4]
      axis_mappings:
        twist-linear-x:
          axis: 1
          scale: 1.0
          offset: 0.0
          threshold: 0.5    
        twist-linear-y:
          axis: 0
          scale: 1.0
          offset: 0.0
          threshold: 0.2    
        twist-angular-z:
          axis: 3
          scale: 1.0
          offset: 0.0
          threshold: 0.2    
